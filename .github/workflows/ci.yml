name: ci

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test-and-integration:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: reliability
          POSTGRES_USER: irc_user
          POSTGRES_PASSWORD: your_strong_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U irc_user -d reliability"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+psycopg2://irc_user:your_strong_password@localhost:5432/reliability

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Apply schema
        run: |
          PSQL_URL="${DATABASE_URL/+psycopg2/}"
          psql "$PSQL_URL" -f sql/schema.sql

      - name: Run ingestion
        run: python pipelines/ingestion/ingest_ai4i.py --verbose

      - name: Run tests
        run: pytest -q

      - name: Train baseline model
        run: python pipelines/training/train_baseline.py --database-url "$DATABASE_URL"

      - name: Run evaluation benchmark
        run: python app/evaluation/run_evaluation.py --database-url "$DATABASE_URL"
