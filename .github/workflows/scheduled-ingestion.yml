name: scheduled-ingestion

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      source_path:
        description: "Path to CSV file in repository workspace"
        required: true
        default: data/ai4i2020.csv
      dataset:
        description: "Dataset route selector"
        required: true
        default: auto

jobs:
  ingest:
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Apply schema
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "DATABASE_URL secret is required"
            exit 1
          fi
          PSQL_URL="${DATABASE_URL/+psycopg2/}"
          psql "$PSQL_URL" -f sql/schema.sql

      - name: Select source path
        id: select_source
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "path=${{ github.event.inputs.source_path }}" >> "$GITHUB_OUTPUT"
            echo "dataset=${{ github.event.inputs.dataset }}" >> "$GITHUB_OUTPUT"
          else
            if [ -d "data/raw/incoming" ]; then
              NEWEST_CSV="$(find data/raw/incoming -type f \( -iname '*.csv' \) -printf '%T@ %p\n' | sort -nr | head -n1 | cut -d' ' -f2-)"
            else
              NEWEST_CSV=""
            fi

            if [ -n "$NEWEST_CSV" ]; then
              echo "path=$NEWEST_CSV" >> "$GITHUB_OUTPUT"
            else
              echo "No CSV source available"
              echo "path=" >> "$GITHUB_OUTPUT"
              echo "dataset=" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "dataset=auto" >> "$GITHUB_OUTPUT"
          fi

      - name: Run routed ingestion
        if: steps.select_source.outputs.path != ''
        run: |
          python pipelines/ingestion/ingest_dataset.py \
            --source-path "${{ steps.select_source.outputs.path }}" \
            --dataset "${{ steps.select_source.outputs.dataset }}" \
            --verbose

      - name: Archive processed incoming CSV
        if: steps.select_source.outputs.path != '' && startsWith(steps.select_source.outputs.path, 'data/raw/incoming/')
        run: |
          SRC="${{ steps.select_source.outputs.path }}"
          ARCHIVE_DIR="data/raw/archive"
          mkdir -p "$ARCHIVE_DIR"

          BASE_NAME="$(basename "$SRC")"
          TS="$(date -u +%Y%m%dT%H%M%SZ)"
          DEST="$ARCHIVE_DIR/${TS}_${BASE_NAME}"

          mv "$SRC" "$DEST"
          echo "Archived $SRC -> $DEST"
