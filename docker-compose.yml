services:
  postgres:
    image: postgres:16
    container_name: irc_postgres
    profiles: ["localdb"]
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-reliability}
      POSTGRES_USER: ${POSTGRES_USER:-irc_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-your_strong_password}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./sql/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-irc_user} -d ${POSTGRES_DB:-reliability}",
        ]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: irc_api
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg2://${POSTGRES_USER:-irc_user}:${POSTGRES_PASSWORD:-your_strong_password}@postgres:5432/${POSTGRES_DB:-reliability}}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    ports:
      - "${API_PORT:-8000}:8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)",
        ]
      interval: 15s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
